name: Unit tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libreadline-dev libcriterion-dev pkg-config

      - name: Run unit tests
        run: make test

      #- name: Run End-To-End tests
      #  run: make e2e
